# Information source configuration.
# The collector now requires a real publish timestamp by default.
# Items without a parseable published_at are skipped.

app:
  lookback_hours: 72
  target_items: 50
  max_items_per_source: 18
  request_timeout_seconds: 20
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36 WeChat-AI-Daily-Agent/0.2"
  cache_images: true
  fetch_article_images: false
  skip_seen_items: true
  # Additional domains allowed for the "official screenshot" image action.
  # Built-in defaults already cover common AI/tech official sites.
  official_screenshot_domains: []
  source_lookback_hours:
    github_ai_recent: 336
    github_trending_python: 336
  source_limits:
    huawei_cn_news: 5
    huawei_en_news: 4
    aws_ml_blog: 5
    microsoft_official_blog: 4
    samsung_global_newsroom: 4
    github_ai_recent: 6
    github_trending_python: 4
  source_minimums:
    github_ai_recent: 3

models:
  summarizer:
    provider: openai
    model: gpt-4.1-mini
    enabled: false

# Public-reaction material collection.
# Keep disabled unless you provide an authorized API/open-platform/proxy endpoint.
# The endpoint should accept query and limit params and return comments in JSON.
opinion_sources:
  douyin:
    enabled: false
    # proxy: call your own authorized endpoint with query/limit.
    # official_video: call Douyin OpenAPI for one or more video item_id/link comments.
    # official_keyword: call Douyin OpenAPI keyword search + keyword video comment APIs.
    mode: official_video
    endpoint: ""
    access_token: ""
    open_base_url: https://open.douyin.com
    open_access_token: ""
    open_id: ""
    client_token: ""
    keyword_search_token: ""
    comment_list_url: https://open.douyin.com/item/comment/list/
    keyword_video_search_url: https://open.douyin.com/video/search/
    keyword_comment_list_url: https://open.douyin.com/video/search/comment/list/
  weibo:
    enabled: false
    mode: proxy
    endpoint: ""
    access_token: ""

sources:
